      </div>

      <div class="spot-explanation">
        <img
          class="sarakura-spots-page"
          src="https://raw.githubusercontent.com/kikkumikuotoko/images/c8748beb2ebaf8b3e2d3176aafa42ac6ff459240/images/4AB261D7-B960-49E2-9E15-8CD27B5E4936.jpg"
          alt="足立公園から見える夜景"
        />

        <p>
          足立公園からは、小倉の街並みを広く見渡すことができます。
          住宅街から市街地まで続く光が広がり、落ち着いた雰囲気の中で夜景を楽しめるスポットです。
        </p>
