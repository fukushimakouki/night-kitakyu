      </div>

      <div class="spot-explanation">
        <img
          class="sarakura-spots-page"
          src="https://raw.githubusercontent.com/kikkumikuotoko/images/ac27d1ee729d4790d2ee120d16f57ad912992949/images/2AA2DC99-0B1B-46D1-96FC-9C50000A8B5E.jpg"
          alt="高塔山の展望台"
        />

        <p>
          高塔山の展望台からは、若松の街並みや港を一望できます。
          海沿いに広がる街明かりや工場の光が印象的で、皿倉山とはまた違った夜景を楽しめます。
        </p>
